<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 448" width="1040" height="896" role="img" aria-label="A diagram of the Scratch stage. A dashed brown line traces the spiral path the sprite moves along when move and turn blocks repeat, each straight segment slightly longer than the one before it. The cat sprite is shown at the end of the path. The stage itself stays blank, because move and turn leave no mark.">
  <title>The spiral path a sprite moves along when move and turn repeat</title>
  <rect width="520" height="448" fill="#FAF8F4"/>
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700">
    <rect x="20" y="20" width="480" height="360" fill="#FFFFFF"/>
    <path d="M 252.9,177.6 L 255.9,177.6 L 261.1,180.6 L 265.6,188.4 L 265.6,200.4 L 258.1,213.4 L 242.5,222.4 L 221.5,222.4 L 200.7,210.4 L 187.2,187.0 L 187.2,157.0 L 203.7,128.4 L 234.9,110.4 L 273.9,110.4 L 310.3,131.4 L 332.8,170.4 L 332.8,218.4 L 307.3,262.6 L 260.5,289.6 L 203.5,289.6 L 151.5,259.6 L 120.0,205.0 L 120.0,139.0 L 154.5,79.3 L 216.9,43.3 L 291.9,43.3 L 359.5,82.3 L 400.0,152.4 L 400.0,236.4 L 356.5,311.7 L 278.5,356.7" fill="none" stroke="#96601A" stroke-width="3" stroke-dasharray="8 10" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="252.9" cy="177.6" r="5.5" fill="#96601A"/>
    <text x="266" y="185" font-size="24" font-weight="400" fill="#96601A" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">start</text>
    <g transform="translate(216.1,287.9) scale(0.8)">
      <g fill="#FFFFFF" stroke="#575E75" stroke-width="2.60" stroke-linejoin="round" stroke-linecap="round"><path d="M 62.4,86.0 L 60.8,71.6 L 72.0,78.8"/><path d="M 93.6,86.0 L 95.2,71.6 L 84.0,78.8"/><path d="M 62.4,86.0 a 16.0,14.4 0 0 0 31.2,0 a 16.0,14.4 0 0 0 -31.2,0 Z"/></g><circle cx="72.0" cy="90.0" r="2.00" fill="#575E75"/><circle cx="84.0" cy="90.0" r="2.00" fill="#575E75"/><g fill="none" stroke="#575E75" stroke-width="1.80" stroke-linecap="round"><path d="M 65.6,95.2 h -6.8"/><path d="M 90.4,95.2 h 6.8"/></g>
    </g>
    <text x="310" y="363" font-size="24" font-weight="400" fill="#96601A" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">end</text>
    <text x="20" y="408" font-size="24" font-weight="400" fill="#6B645B" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">each straight line is one &#8220;move&#8221;</text>
    <text x="20" y="438" font-size="24" font-weight="400" fill="#6B645B" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">each corner is one &#8220;turn&#8221;</text>
  </g>
</svg>
