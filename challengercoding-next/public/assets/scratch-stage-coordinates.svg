<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400"
     role="img" aria-label="The Scratch stage as a coordinate plane, running from minus 240 to 240 across and minus 180 to 180 up and down, with the centre at zero, zero.">
  <rect width="520" height="400" fill="#FAF8F4"/>

  <!-- stage area: 480x360 at 20,20 — the real 4:3 stage, one unit per pixel/2 -->
  <rect x="20" y="20" width="480" height="360" fill="#FFFFFF" stroke="#D6CCBD" stroke-width="1"/>

  <g stroke="#E4DDD2" stroke-width="1">
    <path d="M140 20V380M380 20V380"/>
    <path d="M20 110H500M20 290H500"/>
  </g>

  <!-- axes -->
  <g stroke="#1A5C5C" stroke-width="1.5">
    <path d="M20 200H500"/>
    <path d="M260 20V380"/>
  </g>

  <!-- arrowheads -->
  <g fill="#1A5C5C">
    <path d="M500 200l-9-4.5v9z"/>
    <path d="M260 20l-4.5 9h9z"/>
  </g>

  <!-- origin -->
  <circle cx="260" cy="200" r="4" fill="#A9482F"/>

  <g font-family="ui-monospace, 'SF Mono', monospace" font-size="13" fill="#6B645B">
    <text x="26" y="219">-240</text>
    <text x="466" y="219">240</text>
    <text x="268" y="34">180</text>
    <text x="268" y="376">-180</text>
    <text x="268" y="219" fill="#A9482F">(0, 0)</text>
  </g>

  <g font-family="ui-monospace, 'SF Mono', monospace" font-size="13" fill="#1A5C5C" font-weight="600">
    <text x="474" y="190">x</text>
    <text x="238" y="32">y</text>
  </g>

  <!-- an example sprite position, so the numbers mean something -->
  <circle cx="380" cy="110" r="5" fill="#96601A"/>
  <g stroke="#96601A" stroke-width="1" stroke-dasharray="3 3">
    <path d="M380 110V200M380 110H260"/>
  </g>
  <text x="390" y="106" font-family="ui-monospace, 'SF Mono', monospace" font-size="13" fill="#96601A">(120, 90)</text>
</svg>
