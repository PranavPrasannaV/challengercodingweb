name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Read from .nvmrc so CI and local development cannot drift apart.
          # The postbuild llms.txt generator imports the .ts data modules
          # directly and relies on Node's native type stripping, which is
          # unflagged from 22.18 onward and absent in 20.
          node-version-file: challengercoding-next/.nvmrc
          cache: 'npm'
          cache-dependency-path: challengercoding-next/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ./challengercoding-next
      - name: Build
        run: npm run build
        working-directory: ./challengercoding-next
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./challengercoding-next/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
