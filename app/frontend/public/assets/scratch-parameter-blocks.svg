<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 274" width="1410" height="548" role="img" aria-label="Four Scratch blocks stacked vertically, each with its white input slots labelled: pick random 1 to 10, ask What&#x27;s your name? and wait, say Hello! for 2 seconds, and move 10 steps.">
  <title>Four Scratch blocks that take parameters</title>
  <rect width="705" height="274" fill="#FAF8F4"/>
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700">
    <rect x="16" y="16" width="231.6" height="32" rx="16.0" fill="#59C059" stroke="#389438" stroke-width="1"/>
    <text x="32.0" y="37.7" fill="#FFFFFF">pick random</text>
    <rect x="131.6" y="20.0" width="32.0" height="24" rx="12.0" fill="#FFFFFF"/>
    <text x="147.6" y="37.7" fill="#575E75" text-anchor="middle">1</text>
    <text x="171.6" y="37.7" fill="#FFFFFF">to</text>
    <rect x="193.8" y="20.0" width="37.8" height="24" rx="12.0" fill="#FFFFFF"/>
    <text x="212.7" y="37.7" fill="#575E75" text-anchor="middle">10</text>
    <path d="M 247.6,32.0 H 346.8" stroke="#E0D9A8" stroke-width="1.5" fill="none"/>
    <rect x="346.8" y="18.0" width="342.3" height="28" rx="6" fill="#FFFDD8" stroke="#E0D9A8" stroke-width="1"/><text x="357.8" y="36.6" font-size="13" font-weight="400" fill="#3A3630">picks a random number between the two slots</text>
    <path d="M 16,74 a 4,4 0 0 1 4,-4 h 12 c 2,0 3,1 4,2 l 4,4 c 1,1 2,2 4,2 h 12 c 2,0 3,-1 4,-2 l 4,-4 c 1,-1 2,-2 4,-2 H 308.81600000000003 a 4,4 0 0 1 4,4 V 114 a 4,4 0 0 1 -4,4 H 68 c -2,0 -3,1 -4,2 l -4,4 c -1,1 -2,2 -4,2 h -12 c -2,0 -3,-1 -4,-2 l -4,-4 c -1,-1 -2,-2 -4,-2 H 20 a 4,4 0 0 1 -4,-4 Z" fill="#5CB1D6" stroke="#2E8EB8" stroke-width="1"/>
    <text x="32.0" y="99.7" fill="#FFFFFF">ask</text>
    <rect x="66.7" y="82.0" width="159.9" height="24" rx="12.0" fill="#FFFFFF"/>
    <text x="146.6" y="99.7" fill="#575E75" text-anchor="middle">What&#x27;s your name?</text>
    <text x="234.6" y="99.7" fill="#FFFFFF">and wait</text>
    <path d="M 312.8,94.0 H 346.8" stroke="#E0D9A8" stroke-width="1.5" fill="none"/>
    <rect x="346.8" y="80.0" width="216.0" height="28" rx="6" fill="#FFFDD8" stroke="#E0D9A8" stroke-width="1"/><text x="357.8" y="98.6" font-size="13" font-weight="400" fill="#3A3630">the question the sprite asks</text>
    <path d="M 16,144 a 4,4 0 0 1 4,-4 h 12 c 2,0 3,1 4,2 l 4,4 c 1,1 2,2 4,2 h 12 c 2,0 3,-1 4,-2 l 4,-4 c 1,-1 2,-2 4,-2 H 280.976 a 4,4 0 0 1 4,4 V 184 a 4,4 0 0 1 -4,4 H 68 c -2,0 -3,1 -4,2 l -4,4 c -1,1 -2,2 -4,2 h -12 c -2,0 -3,-1 -4,-2 l -4,-4 c -1,-1 -2,-2 -4,-2 H 20 a 4,4 0 0 1 -4,-4 Z" fill="#9966FF" stroke="#774DCB" stroke-width="1"/>
    <text x="32.0" y="169.7" fill="#FFFFFF">say</text>
    <rect x="66.7" y="152.0" width="63.6" height="24" rx="12.0" fill="#FFFFFF"/>
    <text x="98.5" y="169.7" fill="#575E75" text-anchor="middle">Hello!</text>
    <text x="138.3" y="169.7" fill="#FFFFFF">for</text>
    <rect x="166.7" y="152.0" width="32.0" height="24" rx="12.0" fill="#FFFFFF"/>
    <text x="182.7" y="169.7" fill="#575E75" text-anchor="middle">2</text>
    <text x="206.7" y="169.7" fill="#FFFFFF">seconds</text>
    <path d="M 285.0,164.0 H 346.8" stroke="#E0D9A8" stroke-width="1.5" fill="none"/>
    <rect x="346.8" y="150.0" width="283.3" height="28" rx="6" fill="#FFFDD8" stroke="#E0D9A8" stroke-width="1"/><text x="357.8" y="168.6" font-size="13" font-weight="400" fill="#3A3630">the message, and how long to show it</text>
    <path d="M 16,214 a 4,4 0 0 1 4,-4 h 12 c 2,0 3,1 4,2 l 4,4 c 1,1 2,2 4,2 h 12 c 2,0 3,-1 4,-2 l 4,-4 c 1,-1 2,-2 4,-2 H 179.616 a 4,4 0 0 1 4,4 V 254 a 4,4 0 0 1 -4,4 H 68 c -2,0 -3,1 -4,2 l -4,4 c -1,1 -2,2 -4,2 h -12 c -2,0 -3,-1 -4,-2 l -4,-4 c -1,-1 -2,-2 -4,-2 H 20 a 4,4 0 0 1 -4,-4 Z" fill="#4C97FF" stroke="#3373CC" stroke-width="1"/>
    <text x="32.0" y="239.7" fill="#FFFFFF">move</text>
    <rect x="80.9" y="222.0" width="37.8" height="24" rx="12.0" fill="#FFFFFF"/>
    <text x="99.8" y="239.7" fill="#575E75" text-anchor="middle">10</text>
    <text x="126.7" y="239.7" fill="#FFFFFF">steps</text>
    <path d="M 183.6,234.0 H 346.8" stroke="#E0D9A8" stroke-width="1.5" fill="none"/>
    <rect x="346.8" y="220.0" width="196.0" height="28" rx="6" fill="#FFFDD8" stroke="#E0D9A8" stroke-width="1"/><text x="357.8" y="238.6" font-size="13" font-weight="400" fill="#3A3630">how far the sprite moves</text>
  </g>
</svg>
